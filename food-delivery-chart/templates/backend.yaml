apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.backend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.backend.name }}
    spec:
      containers:
        - name: {{ .Values.backend.name }}
          image: {{ .Values.backend.image }}
          ports:
            - containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: PORT }
            - name: MONGO_URL
              valueFrom:
                configMapKeyRef: { name: app-config, key: MONGO_URL }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: app-secret, key: JWT_SECRET }
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: app-secret, key: STRIPE_SECRET_KEY }
            - name: SALT
              valueFrom:
                secretKeyRef: { name: app-secret, key: SALT }
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
          livenessProbe:
            httpGet: { path: /, port: {{ .Values.backend.containerPort }} }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.backend.containerPort }} }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.backend.name }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.containerPort }}
