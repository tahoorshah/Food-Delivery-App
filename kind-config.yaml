kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000   # frontend NodePort
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001   # backend NodePort
        hostPort: 30001
        protocol: TCP
  - role: worker
  - role: worker
