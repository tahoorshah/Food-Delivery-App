apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: food-delivery
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tahoorshah/Food-Delivery-App.git
    targetRevision: main
    path: food-delivery-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: food-delivery
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
