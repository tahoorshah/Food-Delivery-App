apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: tahoordocker/fda-backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: MONGO_URL
              value: "mongodb://mongo:27017/food-delivery"
            - name: JWT_SECRET
              value: "4185f9e359e283f603c7ef94e6c37865b5e418ad6c01ecca1fd94fa591bff6b2"
            - name: STRIPE_SECRET_KEY
              value: "sk_test_placeholder"
            - name: SALT
              value: "10"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30001
  type: NodePort
